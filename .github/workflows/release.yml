name: Release

# Builds the desktop app for release and publishes it as a GitHub Release,
# with the files the installed app's updater reads (latest.json). Start one
# by pushing a tag: `git tag v0.2.0 && git push origin v0.2.0`. The tag sets
# the version.
#
# macOS (Apple Silicon) only for now. Signed with a self-made certificate
# until there is an Apple Developer account, so the first install needs
# "Open Anyway" in System Settings › Privacy & Security; see
# apps/desktop/README.md, "Releases".
#
# Secrets:
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD
#       Sign the update files; the public key is in tauri.release.conf.json.
#   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY
#       The code-signing certificate (apps/desktop/scripts/make-signing-cert.sh):
#       the .p12 in base64, its password, and its name.
#   SAWMILL_GITHUB_CLIENT_SECRET
#       For signing in with GitHub through the browser (see build.rs).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            packages/editor/package-lock.json
            apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci
        working-directory: packages/editor
      - run: npm ci
        working-directory: apps/desktop
      - name: Version from the tag
        working-directory: apps/desktop/src-tauri
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "The tag must look like v1.2.3, not $GITHUB_REF_NAME" >&2
            exit 1
          fi
          jq --arg v "$version" '.version = $v' tauri.release.conf.json > release.json
      # Tauri can import a certificate itself, but only finds Apple-issued
      # ones in it ("Developer ID Application: ..."). So the self-made one
      # goes into a keychain here, and Tauri signs by name from it.
      - name: Import the signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -base64 24)
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign > /dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          SAWMILL_GITHUB_CLIENT_SECRET: ${{ secrets.SAWMILL_GITHUB_CLIENT_SECRET }}
        with:
          projectPath: apps/desktop
          tauriScript: npx tauri
          args: --target aarch64-apple-darwin --bundles app,dmg --config src-tauri/release.json
          tagName: ${{ github.ref_name }}
          releaseName: Sawmill ${{ github.ref_name }}
          releaseBody: |
            Install by pasting this in Terminal (Apple Silicon Macs):

            ```sh
            curl -fsSL https://raw.githubusercontent.com/egges/sawmill/main/scripts/install.sh | sh
            ```

            Or open the .dmg and drag Sawmill to Applications. The first time, macOS blocks it because it isn't notarized by Apple yet: open System Settings › Privacy & Security and click "Open Anyway".

            Installed apps update themselves.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
