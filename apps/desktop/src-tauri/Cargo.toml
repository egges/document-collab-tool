[package]
name = "sawmill"
version = "0.1.0"
edition = "2024"
# Tauri 2 needs 1.90; docsync itself still supports 1.89.
rust-version = "1.90"
description = "Desktop app: Tauri 2 shell around docsync and the page editor"
publish = false

# Its own workspace: the app needs a newer Rust than docsync and system
# WebView libraries on Linux, so the root workspace's CI doesn't build it.
[workspace]

[lib]
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
docsync = { path = "../../../crates/docsync" }
gethostname = "1.1"
getrandom = "0.3"
keyring = "4"
notify = "8.2"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
trash = "5"
ureq = { version = "3", features = ["json"] }

[dev-dependencies]
tempfile = "3"
