[package]
name = "docsync"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Git-backed synchronization engine for document workspaces"
publish = false

[dependencies]
percent-encoding = "2"
rand = "0.9"
serde_json = "1"
thiserror = "2"
yaml-rust2 = { version = "0.13", default-features = false }

[dev-dependencies]
rand_chacha = "0.9"
tempfile = "3"
