<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sawmill: the spinning saw</title>
<link rel="stylesheet" href="spinner.css">
<style>
  body { margin: 0; padding: 24px; background: #e9e9e2; color: #14213D; font: 14px/1.4 "Inter Variable", Inter, system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; display: grid; gap: 16px; }
  .panel { --muted: #5f6b85; --border: #e4e4dd; --card: #ffffff; --sparkle: #14213D; --button: #14213D; --button-text: #ffffff;
           background: #F7F7F2; color: #14213D; border: 1px solid var(--border); border-radius: 14px; padding: 18px; }
  .panel.dark { --muted: #9aa3b8; --border: #2e3b5a; --card: #14213d; --sparkle: #F7F7F2; --button: #FCA311; --button-text: #14213D;
                background: #0c1426; color: #f1f1ea; }
  h2 { margin: 0 0 14px; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  .sizes { display: flex; align-items: flex-end; gap: 22px; flex-wrap: wrap; margin-bottom: 18px; }
  .size { display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 11px; color: var(--muted); }
  .with-sparkles { position: relative; display: block; }
  .saw-sparkle { fill: var(--sparkle); }
  .examples { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .row { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 9px 14px; }
  .row small { display: block; color: var(--muted); font-size: 12px; }
  .button { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; background: var(--button); color: var(--button-text); border-radius: 9px; padding: 9px 14px; }
  .inline { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--muted); }
</style>

<main>
<section class="panel">
  <h2>Light background</h2>
  <div class="sizes"><div class="size"><svg class="saw-spinner " width="16" height="16" viewBox="0 0 400 400" aria-label="Working"><use href="#saw-small"/></svg><span>16px</span></div><div class="size"><svg class="saw-spinner " width="20" height="20" viewBox="0 0 400 400" aria-label="Working"><use href="#saw-small"/></svg><span>20px</span></div><div class="size"><svg class="saw-spinner " width="24" height="24" viewBox="0 0 400 400" aria-label="Working"><use href="#saw-small"/></svg><span>24px</span></div><div class="size"><svg class="saw-spinner " width="32" height="32" viewBox="0 0 400 400" aria-label="Working"><use href="#saw"/></svg><span>32px</span></div><div class="size"><svg class="saw-spinner " width="48" height="48" viewBox="0 0 400 400" aria-label="Working"><use href="#saw"/></svg><span>48px</span></div><div class="size"><svg class="saw-spinner " width="72" height="72" viewBox="0 0 400 400" aria-label="Working"><use href="#saw"/></svg><span>72px</span></div><div class="size"><span class="with-sparkles" style="width:86px;height:86px"><svg class="saw-spinner" width="72" height="72" viewBox="0 0 400 400" style="position:absolute;left:0;bottom:0"><use href="#saw"/></svg><svg class="saw-sparkle" width="17" height="17" viewBox="0 0 100 100" style="position:absolute;right:1px;top:0"><use href="#sparkle"/></svg><svg class="saw-sparkle" width="9" height="9" viewBox="0 0 100 100" style="position:absolute;right:0;top:22px"><use href="#sparkle"/></svg></span><span>agent at work</span></div></div>
  <div class="examples">
    <div class="row"><svg class="saw-spinner " width="20" height="20" viewBox="0 0 400 400" aria-label="Working"><use href="#saw-small"/></svg><div><b>Agent is drafting the email</b><small>Step 2 of 4</small></div></div>
    <span class="button"><svg class="saw-spinner saw-spinner--inherit" width="16" height="16" viewBox="0 0 400 400" aria-label="Working"><use href="#saw-small"/></svg>Saving…</span>
    <span class="inline"><svg class="saw-spinner saw-spinner--inherit" width="16" height="16" viewBox="0 0 400 400" aria-label="Working"><use href="#saw-small"/></svg> Syncing 3 notes</span>
  </div>
</section>
<section class="panel dark">
  <h2>Dark background</h2>

</section>
</main>
