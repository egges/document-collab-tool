<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Editor demo</title>
  <link rel="stylesheet" href="./demo.css">
</head>
<body>
  <header>
    <strong>Page editor demo</strong>
    <label>Page <select id="page"></select></label>
    <button id="paste" type="button">Open your own Markdown…</button>
    <span id="status" class="status"></span>
    <button id="save" type="button" class="primary">Save</button>
  </header>
  <dialog id="paste-dialog">
    <form method="dialog">
      <p>Paste Markdown to open it as a page.</p>
      <textarea id="paste-text" rows="16" spellcheck="false"></textarea>
      <menu><button value="cancel">Cancel</button> <button value="open" class="primary">Open</button></menu>
    </form>
  </dialog>
  <main>
    <section class="pane">
      <h2>Editor</h2>
      <div id="editor"></div>
    </section>
    <section class="pane">
      <h2>
        <span>page.md</span>
        <span class="tabs">
          <button type="button" data-view="diff" class="active">Changes if saved now</button>
          <button type="button" data-view="disk">On disk</button>
        </span>
      </h2>
      <pre id="file"></pre>
    </section>
  </main>
  <script type="module" src="./main.ts"></script>
</body>
</html>
